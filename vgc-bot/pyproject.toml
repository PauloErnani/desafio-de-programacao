[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vgc-decision-bot"
version = "0.1.0"
description = "Base didática de decisões probabilísticas para VGC em duplas"
requires-python = ">=3.12"
dependencies = ["poke-env==0.16.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.0"]

[tool.setuptools]
packages = ["vgc"]
py-modules = ["bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
